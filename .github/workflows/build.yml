name: Build Jarvis APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Ses modelini indir
        run: |
          mkdir -p app/src/main/assets
          curl -L --fail --retry 5 --retry-delay 5 -o app/src/main/assets/model.zip https://alphacephei.com/vosk/models/vosk-model-small-tr-0.3.zip
          ls -lh app/src/main/assets/model.zip
      - name: Build
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: app/build/outputs/apk/debug/*.apk
